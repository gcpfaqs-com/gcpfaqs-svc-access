services:
  gcpfaqs-svc-accesss-postgres:
    image: postgres:17
    container_name: gcpfaqs-svc-accesss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gcpfaqs-svc-accesss_test
    ports:
      - "5433:5432"
    volumes:
      - gcpfaqs-svc-accesss_postgres_data:/var/lib/postgresql/data

volumes:
  gcpfaqs-svc-accesss_postgres_data:
